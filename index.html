<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div class="calculatorBody">
            <div class="result-Box"><input type="text" class="Result" /></div>

            <div class="grid-Container">
                <div class="grid-Items grid-item-1 light-Black">⌫</div>
                <div class="grid-Items grid-item-2 light-Black">AC</div>
                <div class="grid-Items grid-item-3 light-Black">%</div>
                <div class="grid-Items grid-item-4 orange-Color">÷</div>
                <div class="grid-Items grid-item-5 black-Buttons">7</div>
                <div class="grid-Items grid-item-6 black-Buttons">8</div>
                <div class="grid-Items grid-item-7 black-Buttons">9</div>
                <div class="grid-Items grid-item-8 orange-Color">✖</div>
                <div class="grid-Items grid-item-9 black-Buttons">4</div>
                <div class="grid-Items grid-item-10 black-Buttons">5</div>
                <div class="grid-Items grid-item-11 black-Buttons">6</div>
                <div class="grid-Items grid-item-12 orange-Color">−</div>
                <div class="grid-Items grid-item-13 black-Buttons">1</div>
                <div class="grid-Items grid-item-14 black-Buttons">2</div>
                <div class="grid-Items grid-item-15 black-Buttons">3</div>
                <div class="grid-Items grid-item-16 orange-Color">+</div>
                <div class="grid-Items grid-item-17 black-Buttons">🔆</div>
                <div class="grid-Items grid-item-18 black-Buttons">0</div>
                <div class="grid-Items grid-item-19 black-Buttons">.</div>
                <div class="grid-Items grid-item-20 orange-Color">=</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
